<style>
    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        padding: 0;
        color: black;
        font-family: sans-serif;
        text-align: center;
    }

    /* 화면을 세로로 4등분하는 배경 */
    .background-grid {
        position: fixed;
        inset: 0;
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        z-index: 0;
        pointer-events: none;
    }

    .panel {
        min-width: 0;
        height: 100%;
    }

    /* 첫 번째 칸: 향나무 사진 */
    .tree-left {
        background-image: url("향나무.jpg");
        background-size: cover;
        background-position: center;
        background-repeat: no-repeat;
    }

    /* 가운데 두 칸: 연두색 */
    .green-left,
    .green-right {
        background-color: #c8f0a5;
    }

    /* 네 번째 칸: 눈향나무 사진 */
    .tree-right {
        background-image: url("눈향나무.jpg");
        background-size: cover;
        background-position: center;
        background-repeat: no-repeat;
    }

    /* 본문을 가운데에 배치 */
    .content {
        position: relative;
        z-index: 1;
        width: 50vw;
        margin: 0 auto;
        padding: 30px 20px;
        line-height: 1.7;
    }

    img {
        max-width: 100%;
        height: auto;
    }

    /* 모바일 화면 대응 */
    @media (max-width: 700px) {
        .content {
            width: 100%;
            padding: 20px;
            background-color: rgba(220, 255, 205, 0.92);
        }
    }
</style>
